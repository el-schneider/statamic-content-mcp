name: Update AI Model References

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  update-models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      workflows: write
    steps:
      - uses: actions/checkout@v6

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat <<'PROMPT' | claude -p --model haiku --allowedTools "Read,Write,Edit,Bash,WebSearch"
          Scan this entire codebase — including .github/workflows/ — for ALL
          mentions of specific AI model names or IDs (e.g. claude-sonnet-4-20250514,
          gpt-4o, gemini-2.0-flash). This includes illustrative examples, prompts,
          comments, and documentation — not just functional references.

          Use web search to find the latest available models from each provider
          (Anthropic, OpenAI, Google, etc.).

          Update any outdated model references to their current equivalents.
          Preserve intent — if a small/fast model was used, pick the current
          small/fast model, not the largest.

          If nothing is outdated, change nothing.

          Write a summary of changes (with old → new table) to /tmp/update-summary.md.
          PROMPT

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git diff --name-only)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-ai-models
          delete-branch: true
          commit-message: 'chore: update AI model references'
          title: 'chore: update AI model references'
          body-path: /tmp/update-summary.md
          labels: dependencies, automated
