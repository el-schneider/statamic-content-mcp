name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate, Pint, PHPStan
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v2
      - uses: shivammathur/setup-php@9a96576163ad88ed6f6f2cbf381c5229baf95677
        with:
          php-version: '8.4'
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: composer lint:check

      - run: composer types:check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v2
      - uses: shivammathur/setup-php@9a96576163ad88ed6f6f2cbf381c5229baf95677
        with:
          php-version: '8.4'
          coverage: none

      # The build imports @statamic/cms from vendor. Built against the lowest supported
      # Statamic so the committed build is reproducible and uses nothing newer.
      - run: composer update --no-interaction --prefer-dist --prefer-lowest

      # v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'

      - run: npm ci --ignore-scripts

      - run: npm audit --audit-level=moderate

      - run: npm run check

      - run: npm run types:check

      - run: npm run build

      - name: The committed build is up to date
        run: git diff --exit-code resources/dist

  tests:
    name: Tests – PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['prefer-lowest', 'prefer-stable']
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v2
      - uses: shivammathur/setup-php@9a96576163ad88ed6f6f2cbf381c5229baf95677
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --no-interaction --prefer-dist --${{ matrix.dependencies }}

      - run: composer audit --no-interaction

      - run: composer test
