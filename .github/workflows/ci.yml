name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Validate, Pint, PHPStan
    runs-on: ubuntu-latest
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v2
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Tests – PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: ['prefer-lowest', 'prefer-stable']
    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v2
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --no-interaction --prefer-dist --${{ matrix.dependencies }}

      - run: composer audit --no-interaction

      - run: vendor/bin/pest
