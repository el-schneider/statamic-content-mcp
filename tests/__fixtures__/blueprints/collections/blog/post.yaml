title: Post
tabs:
  main:
    sections:
      - fields:
          - handle: title
            field:
              type: text
              validate:
                - required
          - handle: intro
            field:
              type: bard
              instructions: One short paragraph.
          - handle: content
            field:
              type: bard
              sets:
                media:
                  sets:
                    quote:
                      display: Quote
                      fields:
                        - handle: quote
                          field:
                            type: textarea
                            validate:
                              - required
                        - handle: cite
                          field:
                            type: text
          - handle: tags
            field:
              type: terms
              taxonomies:
                - tags
          - handle: rating
            field:
              type: integer
              validate:
                - min:1
                - max:5
          - handle: legacy_id
            field:
              type: text
              visibility: read_only
