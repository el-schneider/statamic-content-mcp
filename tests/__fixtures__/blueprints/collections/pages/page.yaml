title: Page
tabs:
  main:
    sections:
      - fields:
          - handle: title
            field:
              type: text
              validate:
                - required
          - handle: page_builder
            field:
              type: replicator
              sets:
                blocks:
                  sets:
                    hero:
                      display: Hero
                      fields:
                        - handle: heading
                          field:
                            type: text
                            validate:
                              - required
                        - handle: badge
                          field:
                            type: text
                            visibility: read_only
                        - handle: image
                          field:
                            type: assets
                            container: assets
                            max_files: 1
                    rich_text:
                      display: Rich text
                      fields:
                        - handle: text
                          field:
                            type: bard
          - handle: settings
            field:
              type: group
              fields:
                - handle: theme
                  field:
                    type: select
                    options:
                      light: Light
                      dark: Dark
                - handle: accent
                  field:
                    type: text
                    default: blue
                - handle: owner
                  field:
                    type: text
                    visibility: read_only
